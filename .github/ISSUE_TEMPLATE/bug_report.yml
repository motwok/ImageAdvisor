name: Bug report
description: Report something that doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the fields below;
        the details make it much easier to reproduce and fix. Remove host names, image
        names or labels you do not want to make public.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is **not** a security vulnerability (those go through [SECURITY.md](https://github.com/motwok/ImageAdvisor/security/advisories/new), not a public issue).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: A container is missing from /metrics / an update is reported although the image is current / ...
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: Symptoms
      description: Which did you observe?
      options:
        - label: A container is missing from /metrics
        - label: An update is reported although the image is current
        - label: An update is not reported although a newer image exists
        - label: The check fails for a registry
        - label: The container does not start or /metrics does not answer
        - label: Other (describe above)

  - type: input
    id: version
    attributes:
      label: ImageAdvisor version
      description: Image tag or digest, or the version label of imageadvisor_build_info.
      placeholder: e.g. sha256:... or the version label
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker version
      description: Output of `docker version --format '{{.Server.Version}}'` on the host.
      placeholder: e.g. 28.5.1
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Affected image reference
      description: The image of the affected container as in `docker inspect --format '{{.Config.Image}}' <container>`, and the registry.
      placeholder: e.g. ghcr.io/example/app:1.4
    validations:
      required: false

  - type: textarea
    id: metrics
    attributes:
      label: Relevant /metrics lines and container log
      description: The affected series and the output of `docker logs <container>`.
      render: text
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Even rough steps help.
      placeholder: |
        1. Start a container from ...
        2. Push a new image to the same tag
        3. /metrics shows ...
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Compose file excerpt, screenshots, anything else.
    validations:
      required: false
